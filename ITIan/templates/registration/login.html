{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
        <a href="{% url 'register' %}" class="btn btn-cancel">Register</a>
    </form>
</div>

{% endblock %}
