{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <h1>Trainee Details</h1>

    <table>
        <tr>
            <th>ID</th>
            <td>{{ trainee.pk }}</td>
        </tr>
        <tr>
            <th>Name</th>
            <td>{{ trainee.name }}</td>
        </tr>
        <tr>
            <th>Email</th>
            <td>{{ trainee.email }}</td>
        </tr>
        <tr>
            <th>Phone</th>
            <td>{{ trainee.phone }}</td>
        </tr>
    </table>

    <br>
    <a href="{% url 'update_trainee' trainee.pk %}" class="btn btn-edit">Edit</a>
    <a href="{% url 'delete_trainee' trainee.pk %}" class="btn btn-delete">Delete</a>
    <a href="{% url 'trainee_list' %}" class="btn btn-cancel">Back to List</a>
</div>

{% endblock %}
