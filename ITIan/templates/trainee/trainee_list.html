{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h1>Trainees</h1>
    <a href="{% url 'add_trainee' %}" class="btn btn-primary">+ Add Trainee</a>
</div>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for trainee in trainees %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ trainee.name }}</td>
            <td>{{ trainee.email }}</td>
            <td>{{ trainee.phone }}</td>
            <td>
                <a href="{% url 'update_trainee' trainee.pk %}" class="btn btn-edit">Edit</a>
                <a href="{% url 'delete_trainee' trainee.pk %}" class="btn btn-delete">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No trainees yet.</td></tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
