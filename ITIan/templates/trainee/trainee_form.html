{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <h1>{{ action }} Trainee</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ trainee.name }}" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ trainee.email }}" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ trainee.phone }}" required>
        </div>
        <button type="submit" class="btn btn-primary">{{ action }}</button>
        <a href="{% url 'trainee_list' %}" class="btn btn-cancel">Cancel</a>
    </form>
</div>

{% endblock %}
