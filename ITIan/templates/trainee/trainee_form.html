{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <h1>{{ action }} Trainee</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ action }}</button>
        <a href="{% url 'trainee_list' %}" class="btn btn-cancel">Cancel</a>
    </form>
</div>

{% endblock %}
