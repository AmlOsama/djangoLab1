{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h1>Courses</h1>
    <a href="{% url 'add_course' %}" class="btn btn-primary">+ Add Course</a>
</div>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Description</th>
            <th>Duration</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for course in courses %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ course.title }}</td>
            <td>{{ course.description }}</td>
            <td>{{ course.duration }}</td>
            <td>
                <a href="{% url 'update_course' course.pk %}" class="btn btn-edit">Edit</a>
                <a href="{% url 'delete_course' course.pk %}" class="btn btn-delete">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No courses yet.</td></tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
