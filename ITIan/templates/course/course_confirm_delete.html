{% extends 'base.html' %}
{% block content %}

<div class="form-container">
    <h1>Delete Course</h1>
    <p>Are you sure you want to delete <strong>{{ course.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-delete">Yes, Delete</button>
        <a href="{% url 'course_list' %}" class="btn btn-cancel">Cancel</a>
    </form>
</div>

{% endblock %}
